name: Container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yuu1111/streamnotifier

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go mod download
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/stream-notifier

  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy with Dockhand
        env:
          DOCKHAND_WEBHOOK_URL: ${{ vars.DOCKHAND_WEBHOOK_URL }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          test -n "$DOCKHAND_WEBHOOK_URL"
          test -n "$DOCKHAND_WEBHOOK_SECRET"
          body='{}'
          signature="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DOCKHAND_WEBHOOK_SECRET" | awk '{print $NF}')"
          response=$(curl --fail-with-body --silent --show-error --max-time 900 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Hub-Signature-256: $signature" \
            --data "$body" \
            "$DOCKHAND_WEBHOOK_URL")
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true' > /dev/null
      - name: Clean up old GHCR versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          pwsh -NoProfile -File .github/scripts/cleanup-ghcr-versions.ps1
          -Package streamnotifier
          -Keep 3
